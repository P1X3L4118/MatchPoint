<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="Marcadores de fútbol de hoy, actualizados automáticamente.">
  <title>Fútbol Central · Marcadores en directo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="live.css">
  <script src="live.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-mark">FC</span><span>fútbol<span class="brand-light">central</span></span></a>
      <div class="top-meta"><span class="live-pulse"></span> MARCADORES DEL DÍA</div>
    </header>
    <section class="hero">
      <div><p class="eyebrow">EL FÚTBOL, AL MOMENTO</p><h1>Partidos de <em>hoy.</em></h1><p class="subtitle">Resultados, horarios y estado de cada encuentro en una sola vista.</p></div>
      <div class="date-card"><span>FECHA</span><strong id="today-date">—</strong></div>
    </section>
    <section class="toolbar">
      <div class="filters" id="league-filters" aria-label="Filtrar por competición"></div>
      <div class="refresh"><span id="updated-at">Conectando…</span><button id="refresh" type="button" aria-label="Actualizar partidos">↻ <span>Actualizar</span></button></div>
    </section>
    <div id="message" class="message" role="status" aria-live="polite">Cargando partidos…</div>
    <section id="match-list" class="match-list" aria-live="polite"></section>
    <footer>Datos deportivos: FotMob · Fuente no oficial · La actualización puede depender de la disponibilidad del servicio.</footer>
  </main>
</body>
</html>
