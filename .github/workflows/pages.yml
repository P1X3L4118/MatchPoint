name: Actualizar resultados y publicar Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: matchpoint-highlights
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
        id: source-checkout
      - id: source
        name: Registrar commit del código compilado
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtener calendarios, tablas y líderes de FotMob
        run: python fetch_daily.py data/football.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Comprobar que el artefacto corresponde al último commit de main
        id: freshness
        env:
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          latest_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$BUILT_SHA" = "$latest_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Se omite la publicación: el artefacto quedó desactualizado."
          fi
      - name: Publicar en GitHub Pages
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v4
